services:
  # Frontend (Static SPA)
  - type: web
    name: bitbeats
    env: static
    buildCommand: npm run render-deploy
    staticPublishPath: ./dist
    routes:
      # CRITICAL: This allows React Router (SPA) to work on refresh
      - type: rewrite
        source: /*
        destination: /index.html

  # Backend API (Node)
  - type: web
    name: bitbeats-api
    env: node
    buildCommand: npm ci && npm run build:api
    startCommand: node dist/server/index.js
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: MB_USER_AGENT
        value: BitBeats/2.0.0 ( contact@bitbeats.p2p )
      - key: ACOUSTID_API_KEY
        sync: false
    routes:
      - type: rewrite
        source: /api/*
        destination: /api/$1